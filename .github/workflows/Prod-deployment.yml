name: main Branch to Production
on: 
  push:
    branches: 
      - main
      - dev
 
jobs:
  SFDX-CLI-Deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: echo "GitHub Action running on ${{ runner.os }}"
      - run: echo "Retrieving main Branch from ${{ github.repository }}."
      - uses: actions/checkout@v4
        with: 
          ref: 'main'
      - name: 'Read PR Body and Format Tests'
        env:
           PR_BODY: ${{ github.event.head_commit.message }}
        run: |
             echo "Original Merge Commit Message: $PR_BODY"
      
             # Extract test classes using regex (Modify based on your commit message pattern)
             TESTS=$(echo "$PR_BODY" | grep -oP '(?<=TESTS: )[^]]*' || echo "all")
      
             # Save extracted test classes
             echo "Extracted Tests: $TESTS"
             echo "APEX_TESTS=$TESTS" >> $GITHUB_ENV
  
             # Ensure the merge comment appears in a structured format
             echo "Formatted Commit Message:"
             echo "Merge Commit: $(echo "$PR_BODY" | tr '\n' ' ')"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Install Salesforce CLI
        run: |
          npm install @salesforce/cli --global
          sf --help
          pip install xq
          pip install yq
      - name: Install sfdxGit delta
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf sgd:source:delta --to "HEAD" --from "HEAD~1"  --output "." --ignore .github/workflows/ignore.txt

      - name: Update API Version in package.xml
        run: |
          sed -i 's|<version>55.0</version>|<version>66.0</version>|g' package/package.xml
          cat package/package.xml
          
      - name: Create server key
        env:
          SERVER_KEY: ${{ secrets.SALESFORCE_JWT_SECRET_KEY }}
        run: echo "$SERVER_KEY" > server.key
      - run: sf org login jwt --client-id 3MVG9XgkMlifdwVARKX9mYeDMGUNFWpTzdqjm3Wt1GC4nAcnwzd45CE4lCVFLZ8UVvQYHti..F6EuVnH0Tr58
         --jwt-key-file server.key --username mohammedasif3825.a9fe638d49ad@agentforce.com --instance-url http://orgfarm-18d64b3d75-dev-ed.develop.my.salesforce.com --alias production
      - name: Deploy Delta components to Salesforce RunSpecifiedTests
        if: ${{ env.APEX_TESTS != 'all' }}
        run: |
          sf project deploy start --manifest package/package.xml --test-level RunSpecifiedTests --tests ${{ env.APEX_TESTS }} --target-org production --ignore-conflicts --api-version 66.0
 
      - name: Deploy Delta components to Salesforce RunLocalTests
        if: ${{ env.APEX_TESTS == 'all' }}
        run: |
            sf project deploy start --manifest package/package.xml --test-level RunLocalTests --target-org production --ignore-conflicts --api-version 66.0