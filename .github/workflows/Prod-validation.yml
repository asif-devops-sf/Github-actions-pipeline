name: validate delta changes in Production

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read
  pull-requests: read

# One run per PR: a new run cancels the one already in progress.
# Unrelated labels (not the bypass label) get their own unique group, so they
# can never cancel a real validation run.
concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'quality-gate-bypass-requested') && github.run_id || 'main' }}
  cancel-in-progress: true

jobs:
  # Pauses until a reviewer configured on the "quality-gate-bypass" environment
  # (Settings > Environments) approves. Runs only when the bypass label is present.
  # No runner time is used while the run is waiting for approval.
  bypass-approval:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'quality-gate-bypass-requested') &&
      (
        github.event.action == 'synchronize' ||
        github.event.action == 'reopened' ||
        (github.event.action == 'labeled' && github.event.label.name == 'quality-gate-bypass-requested')
      )
    runs-on: ubuntu-latest
    environment: quality-gate-bypass
    steps:
      - name: Bypass approved
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Quality gate bypass approved for PR #$PR_NUMBER"

  SFDX-CLI-Deploy:
    # Waits for bypass-approval (if it was triggered) before doing anything
    needs: bypass-approval
    if: >-
      !cancelled() && (
        github.event.action == 'synchronize' ||
        github.event.action == 'reopened' ||
        (github.event.action == 'opened' && !contains(github.event.pull_request.labels.*.name, 'quality-gate-bypass-requested')) ||
        (github.event.action == 'labeled' && github.event.label.name == 'quality-gate-bypass-requested')
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # STEP 1: Bypass decision (approved only if the environment reviewer approved)
      - name: Quality Gate Bypass Decision
        id: gate-decision
        env:
          BYPASS_RESULT: ${{ needs.bypass-approval.result }}
        shell: bash
        run: |
          echo "Bypass approval result: $BYPASS_RESULT"

          if [ "$BYPASS_RESULT" = "success" ]; then
            echo "Bypass approved by environment reviewer. Quality gates will be skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$BYPASS_RESULT" = "failure" ]; then
              echo "Bypass was rejected. Quality gates will run."
            else
              echo "No bypass requested. Quality gates will run."
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: echo "GitHub Action running on ${{ runner.os }}"

      - run: echo "Retrieving main Branch from ${{ github.repository }}."

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create server key
        env:
          SERVER_KEY: ${{ secrets.SALESFORCE_JWT_SECRET_KEY }}
        run: echo "$SERVER_KEY" > server.key

      - name: Authenticate Salesforce Org
        run: |
          sf org login jwt \
            --client-id 3MVG9XgkMlifdwVARKX9mYeDMGUNFWpTzdqjm3Wt1GC4nAcnwzd45CE4lCVFLZ8UVvQYHti..F6EuVnH0Tr58 \
            --jwt-key-file server.key \
            --username mohammedasif3825.a9fe638d49ad@agentforce.com \
            --instance-url https://orgfarm-18d64b3d75-dev-ed.develop.my.salesforce.com \
            --alias production

      - name: Debug Test Classes File
        run: cat test-classes.txt

      - name: Read Test Class Names from File
        id: read-test-classes
        run: |
          TEST_CLASSES=$(cat test-classes.txt | tr '\n' ',' | sed 's/,$//')

          if [ -z "$TEST_CLASSES" ]; then
            echo "TEST_CLASSES=" >> $GITHUB_ENV
            echo "RUN_TESTS=false" >> $GITHUB_ENV
          else
            echo "TEST_CLASSES=$TEST_CLASSES" >> $GITHUB_ENV
            echo "RUN_TESTS=true" >> $GITHUB_ENV
          fi

      - name: Install sfdxGitDelta
        run: |
          echo y | sf plugins install sfdx-git-delta

      - name: Generate Delta between main and PR Branch
        run: |
          sf sgd source delta \
            --to "HEAD" \
            --from "origin/main" \
            --output "." \
            --ignore .github/workflows/ignore.txt

      - name: Update API Version in package.xml
        run: |
          sed -i 's|<version>55.0</version>|<version>66.0</version>|g' package/package.xml
          cat package/package.xml

      # Check whether the delta contains deployable Salesforce metadata
      # (HAS_DELTA was previously never set in the validation workflow)
      - name: Check Salesforce Delta
        id: delta-check
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("package/package.xml")

          if not manifest.is_file():
              raise SystemExit("ERROR: package/package.xml not found.")

          root = ET.parse(manifest).getroot()

          has_delta = any(
              member.text and member.text.strip()
              for member in root.findall(".//{*}members")
          )

          with open("delta-status.txt", "w") as f:
              f.write(f"HAS_DELTA={'true' if has_delta else 'false'}\n")

          print(f"Salesforce metadata available: {has_delta}")
          PY

          cat delta-status.txt >> "$GITHUB_ENV"

      # STEP 2: Install Code Analyzer only when bypass is not approved
      - name: Install Salesforce Code Analyzer
        if: steps.gate-decision.outputs.skip != 'true'
        run: |
          sf plugins install code-analyzer

      # STEP 3: Generate Analyzer targets only when required
      - name: Generate Code Analyzer Targets from package.xml
        if: steps.gate-decision.outputs.skip != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("package/package.xml")

          if not manifest.is_file():
              raise SystemExit("ERROR: package/package.xml not found.")

          root = ET.parse(manifest).getroot()

          base = Path("force-app/main/default")
          targets = set()

          metadata_paths = {
              "ApexClass": ("classes", ".cls"),
              "ApexTrigger": ("triggers", ".trigger"),
          }

          for item in root.findall(".//{*}types"):
              metadata_type = item.findtext("{*}name")
              members = [
                  member.text
                  for member in item.findall("{*}members")
                  if member.text
              ]

              if metadata_type in metadata_paths:
                  folder, extension = metadata_paths[metadata_type]
                  directory = base / folder

                  for member in members:
                      if member == "*":
                          if directory.is_dir():
                              targets.update(
                                  str(path)
                                  for path in directory.glob(f"*{extension}")
                                  if path.is_file()
                              )
                      else:
                          path = directory / f"{member}{extension}"
                          if path.is_file():
                              targets.add(str(path))

              elif metadata_type in (
                  "LightningComponentBundle",
                  "AuraDefinitionBundle"
              ):
                  folder = (
                      "lwc"
                      if metadata_type == "LightningComponentBundle"
                      else "aura"
                  )

                  directory = base / folder

                  for member in members:
                      if member == "*":
                          if directory.is_dir():
                              targets.update(
                                  str(path)
                                  for path in directory.iterdir()
                                  if path.is_dir()
                              )
                      else:
                          path = directory / member
                          if path.is_dir():
                              targets.add(str(path))

          targets = sorted(targets)

          output_file = Path("code-analyzer-targets.txt")

          if targets:
              output_file.write_text("\n".join(targets) + "\n")
              print("Components selected from package.xml:")
              for target in targets:
                  print(f"- {target}")
          else:
              output_file.write_text("")
              print("No supported changed components found in package.xml.")

          PY

      # STEP 4: Run Analyzer only when bypass is not approved
      - name: Code Analyzer Quality Gate (package.xml components only)
        if: steps.gate-decision.outputs.skip != 'true'
        shell: bash
        run: |
          mapfile -t TARGETS < code-analyzer-targets.txt

          echo "## Code Analyzer - Manifest Based Scan" >> $GITHUB_STEP_SUMMARY

          if [ ${#TARGETS[@]} -eq 0 ]; then
            echo "No supported components found in package.xml. Scan skipped." >> $GITHUB_STEP_SUMMARY
            echo "No supported components to scan."
            exit 0
          fi

          echo "Scanning components listed in package.xml:"
          printf '%s\n' "${TARGETS[@]}"

          echo "### Scanned Components" >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "${TARGETS[@]}" | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

          ARGS=()

          for target in "${TARGETS[@]}"; do
            ARGS+=(--target "$target")
          done

          STATUS=0

          sf code-analyzer run \
            --workspace force-app \
            "${ARGS[@]}" \
            --rule-selector Recommended \
            --severity-threshold 2 \
            --output-file code-analyzer-report.csv || STATUS=$?

          if [ "$STATUS" -eq 0 ]; then
            echo "Result: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "Result: FAILED - Issues at or above severity threshold." >> $GITHUB_STEP_SUMMARY
          fi

          exit $STATUS

      - name: Record Quality Gate Bypass
        if: steps.gate-decision.outputs.skip == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "## Quality Gate Bypass" >> $GITHUB_STEP_SUMMARY
          echo "Salesforce Code Analyzer was skipped." >> $GITHUB_STEP_SUMMARY
          echo "Approved via the quality-gate-bypass environment reviewers." >> $GITHUB_STEP_SUMMARY
          echo "PR: #$PR_NUMBER" >> $GITHUB_STEP_SUMMARY
          echo "Commit: $HEAD_SHA" >> $GITHUB_STEP_SUMMARY

      - name: Upload Code Analyzer report
        if: always() && steps.gate-decision.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-report
          path: code-analyzer-report.csv
          if-no-files-found: ignore

      - name: Debug Environment Variables
        run: |
          echo "TEST_CLASSES=${{ env.TEST_CLASSES }}"
          echo "RUN_TESTS=${{ env.RUN_TESTS }}"

      - name: Validate Delta Components with Specified Tests
        if: ${{ env.RUN_TESTS == 'true' && env.HAS_DELTA == 'true' }}
        run: |
          if [ -z "${{ env.TEST_CLASSES }}" ]; then
            echo "No test classes specified. Exiting."
            exit 1
          fi

          echo "Running specified tests: ${{ env.TEST_CLASSES }}"

          sf project deploy validate \
            --manifest package/package.xml \
            --test-level RunSpecifiedTests \
            --tests ${{ env.TEST_CLASSES }} \
            --target-org production \
            --api-version 66.0