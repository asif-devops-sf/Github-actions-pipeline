---
    name: validate delta changes in Production
    on:
      pull_request:
        branches:
          - main
    jobs:
      SFDX-CLI-Deploy:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/setup-node@v4
            with:
              node-version: "22"
          - run: echo "GitHub Action running on ${{ runner.os }}"
          - run: echo "Retrieving main Branch from ${{ github.repository }}."
          - uses: actions/checkout@v4
            with:
              fetch-depth: 0
          - name: SonarQube Scan
            uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
            env:
              SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          - name: Install Salesforce CLI
            run: |
              npm install -g @salesforce/cli
          - uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: '17'
          - name: Code Analyzer quality gate (changed files only)
            run: |
              sf plugins install code-analyzer
              FILES=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- \
                force-app/main/default/classes \
                force-app/main/default/triggers \
                force-app/main/default/lwc \
                force-app/main/default/aura | grep -E '\.(cls|trigger|js|html|cmp)$' || true)
              if [ -z "$FILES" ]; then
                echo "No Apex/Trigger/LWC/Aura changes to scan"
                echo "## Code Analyzer" >> $GITHUB_STEP_SUMMARY
                echo "No Apex/Trigger/LWC/Aura changes to scan" >> $GITHUB_STEP_SUMMARY
                exit 0
              fi
              echo "Scanning:"
              echo "$FILES"
              ARGS=""
              for f in $FILES; do ARGS="$ARGS --target $f"; done
              STATUS=0
              sf code-analyzer run --workspace force-app $ARGS --rule-selector Recommended --severity-threshold 3 --output-file code-analyzer-report.csv || STATUS=$?
              echo "## Code Analyzer (changed files only)" >> $GITHUB_STEP_SUMMARY
              echo "Scanned files:" >> $GITHUB_STEP_SUMMARY
              echo "$FILES" | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
              if [ "$STATUS" -eq 0 ]; then
                echo "Result: PASSED" >> $GITHUB_STEP_SUMMARY
              else
                echo "Result: FAILED (issues at or above the severity threshold). Download the report from Artifacts." >> $GITHUB_STEP_SUMMARY
              fi
              exit $STATUS
          - name: Upload Code Analyzer report
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: code-analyzer-report
              path: code-analyzer-report.csv
              if-no-files-found: ignore
          - name: Create server key
            env:
                SERVER_KEY: ${{ secrets.SALESFORCE_JWT_SECRET_KEY }}
            run: echo "$SERVER_KEY" > server.key
          - run: sf org login jwt --client-id 3MVG9XgkMlifdwVARKX9mYeDMGUNFWpTzdqjm3Wt1GC4nAcnwzd45CE4lCVFLZ8UVvQYHti..F6EuVnH0Tr58 --jwt-key-file server.key --username 	mohammedasif3825.a9fe638d49ad@agentforce.com --instance-url http://orgfarm-18d64b3d75-dev-ed.develop.my.salesforce.com --alias production
          - name: Debug Test Classes File
            run: cat test-classes.txt
          - name: Read Test Class Names from File
            id: read-test-classes
            run: |
              TEST_CLASSES=$(cat test-classes.txt | tr '\n' ',' | sed 's/,$//')
              if [ -z "$TEST_CLASSES" ]; then
                echo "TEST_CLASSES=" >> $GITHUB_ENV
                echo "RUN_TESTS=false" >> $GITHUB_ENV
              else
                echo "TEST_CLASSES=$TEST_CLASSES" >> $GITHUB_ENV
                echo "RUN_TESTS=true" >> $GITHUB_ENV
              fi
          - name: Install sfdxGitDelta
            run: |
              echo y | sf plugins install sfdx-git-delta
          - name: Generate Delta between main and PR Branch
            run: >
              # Generate the delta changes between the base branch and the head of the PR
    
              sf sgd source delta --to "HEAD" --from "origin/main" --output "." --ignore .github/workflows/ignore.txt    
          - name: Update API Version in package.xml
            run: |
                  sed -i 's|<version>55.0</version>|<version>66.0</version>|g' package/package.xml
                  cat package/package.xml
          - name: Debug Environment Variables
            run: |
              echo "TEST_CLASSES=${{ env.TEST_CLASSES }}"
              echo "RUN_TESTS=${{ env.RUN_TESTS }}"
          - name: Validate Delta Components with Specified Tests
            if: ${{ env.RUN_TESTS == 'true' }}
            run: >
              if [ -z "${{ env.TEST_CLASSES }}" ]; then
                echo "No test classes specified. Exiting."
                exit 1
              fi
    
              echo "Running specified tests: ${{ env.TEST_CLASSES }}"
    
              sf project deploy validate --manifest package/package.xml --test-level RunSpecifiedTests --tests ${{ env.TEST_CLASSES }} --target-org production --api-version 66.0